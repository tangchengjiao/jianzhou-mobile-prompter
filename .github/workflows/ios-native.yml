name: iOS native build and tests

on:
  workflow_dispatch:
  push:
    branches: [codex/mobile-preview]
    paths:
      - ios/**
      - .github/workflows/ios-native.yml

permissions:
  contents: write

jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare Xcode project
        working-directory: ios
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.app
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcodegen generate
      - name: Build unsigned iPhone app
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project JianzhouPrompter.xcodeproj -scheme JianzhouPrompter -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/device-build.log
      - name: Run Chinese alignment tests
        timeout-minutes: 15
        working-directory: ios
        run: |
          set -o pipefail
          device_id=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '--json']))
          runtime = next(r for r in data['runtimes'] if r.get('isAvailable') and r['version'].startswith('27.0') and 'iOS' in r['name'])
          created = subprocess.check_output(['xcrun', 'simctl', 'create', 'Jianzhou iPhone 13', 'com.apple.CoreSimulator.SimDeviceType.iPhone-13', runtime['identifier']], text=True)
          print(created.strip())
          PY
          )
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild -project JianzhouPrompter.xcodeproj -scheme JianzhouPrompter -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO test | tee build/tests.log
          xcrun simctl uninstall "$device_id" com.jianzhou.prompter
          xcrun simctl install "$device_id" build/Simulator/Build/Products/Debug-iphonesimulator/JianzhouPrompter.app
          xcrun simctl launch "$device_id" com.jianzhou.prompter
          sleep 2
          xcrun simctl io "$device_id" screenshot build/ios-home.png
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p build/Payload
          ditto build/Device/Build/Products/Release-iphoneos/JianzhouPrompter.app build/Payload/JianzhouPrompter.app
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload JianzhouPrompter-unsigned.ipa
      - name: Save build result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: JianzhouPrompter-iOS-experiment
          path: |
            ios/build/*.ipa
            ios/build/*.log
            ios/build/*.png
          retention-days: 3
          if-no-files-found: warn
      - name: Publish unsigned iOS experiment
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ios-v0.1.0-preview.2
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title '见舟提词 iOS：稿件副本与 TXT 导出' --notes '首页可保存稿件副本、导出 UTF-8 TXT，并恢复上次打开的稿件。未签名 IPA 需本人自用签名安装。构建与 iPhone 13 / iOS 27 模拟器测试来自本次运行；真实录像兼容性仍待本人真机验证。'
          fi
          gh release upload "$tag" build/JianzhouPrompter-unsigned.ipa build/ios-home.png --clobber
