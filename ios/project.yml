name: JianzhouPrompter
options:
  bundleIdPrefix: com.jianzhou
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  JianzhouPrompter:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ThirdParty
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianzhou.prompter
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: 见舟提词
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSCameraUsageDescription: 拍摄口播视频，并在相机预览中显示可拖动的提词文字。
        NSPhotoLibraryAddUsageDescription: 将你在见舟提词中拍摄的视频保存到相册。
        NSMicrophoneUsageDescription: 为口播视频录制声音，并用同一路声音定位你正在朗读的句子。
        NSSpeechRecognitionUsageDescription: 将你的声音在支持的设备上转为文字，让稿子跟随朗读。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  JianzhouPrompterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: JianzhouPrompter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  JianzhouPrompterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: JianzhouPrompter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JianzhouPrompter:
    build:
      targets:
        JianzhouPrompter: all
    test:
      targets: [JianzhouPrompterTests, JianzhouPrompterUITests]
